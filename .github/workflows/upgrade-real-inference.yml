name: Upgrade COSMO with real deepfake inference

on:
  push:
    branches:
      - cosmo-real-deepfake-inference
    paths:
      - .github/workflows/upgrade-real-inference.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cosmo-real-deepfake-inference

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ONNX Runtime Web
        run: npm install onnxruntime-web@1.29.0 --save

      - name: Apply real inference upgrade
        run: python scripts/apply_real_inference.py

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/App.tsx src/data.ts src/styles.css src/forensics.ts public/cocoon scripts/apply_real_inference.py scripts/ailab_real_inference.tsx.txt scripts/forensics_css.txt
          git diff --cached --quiet && exit 0
          git commit -m "Cache official Cocoon media for real inference"
          git push origin cosmo-real-deepfake-inference
