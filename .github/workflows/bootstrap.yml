name: Bootstrap COSMO source

on:
  push:
    branches: [cosmo-bootstrap]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmo-bootstrap
      - name: Rebuild source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 -d > /tmp/cosmo-source.zip
          rm -rf /tmp/cosmo-source
          mkdir -p /tmp/cosmo-source
          unzip -q /tmp/cosmo-source.zip -d /tmp/cosmo-source
          rsync -a --delete --exclude='.git' --exclude='.bootstrap' /tmp/cosmo-source/cosmo-trust-platform/ ./
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build COSMO SaaS prototype from Lovable baseline'
          git push origin HEAD:cosmo-bootstrap
