name: COSMO Live Cloudflare E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Cloudflare Pages production is reachable
        run: |
          for i in $(seq 1 18); do
            code=$(curl -L -sS -o /tmp/cosmo-home.html -w '%{http_code}' --max-time 20 "https://cosmo-trust-platform.pages.dev/?e2e=$i" || true)
            if [ "$code" = "200" ]; then
              echo "Correct Cloudflare Pages production URL is reachable."
              exit 0
            fi
            echo "Waiting for Cloudflare Pages production ($i/18), HTTP=$code"
            sleep 10
          done
          echo "Cloudflare Pages production URL is not reachable."
          exit 1

      - name: Run desktop and mobile live journeys
        env:
          COSMO_BASE_URL: https://cosmo-trust-platform.pages.dev
        run: npx playwright test tests/live-e2e.spec.ts --workers=1 --reporter=line
