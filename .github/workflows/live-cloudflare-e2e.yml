name: COSMO Live Cloudflare E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve exact Cloudflare Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          preview=""
          for i in $(seq 1 30); do
            json=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" || true)
            summary=$(printf '%s' "$json" | jq -r '.check_runs[]? | select(.name=="Cloudflare Pages: cosmo-trust-platform" and .conclusion=="success") | .output.summary' | head -n 1)
            preview=$(printf '%s' "$summary" | grep -oE 'https://[a-z0-9]+\.cosmo-trust-platform\.pages\.dev' | head -n 1 || true)
            if [ -n "$preview" ]; then
              code=$(curl -L -sS -o /tmp/cosmo-home.html -w '%{http_code}' --max-time 20 "$preview/?e2e=$i" || true)
              if [ "$code" = "200" ]; then
                echo "COSMO_BASE_URL=$preview" >> "$GITHUB_ENV"
                echo "Cloudflare Pages deployment resolved: $preview"
                exit 0
              fi
            fi
            echo "Waiting for exact Cloudflare Pages deployment ($i/30)"
            sleep 6
          done
          echo "Could not resolve a reachable Cloudflare Pages deployment for $GITHUB_SHA"
          exit 1

      - name: Run desktop and mobile live journeys
        run: npx playwright test tests/live-e2e.spec.ts --workers=1 --reporter=line
